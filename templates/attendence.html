{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 fw-bold">Student Attendance Tracking</h2>

<div class="row g-4">
    <div class="col-md-5">
        <div class="card p-4">
            <h5 class="fw-bold mb-3">Update Today's Headcount</h5>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Total Enrolled Students</label>
                    <input type="number" class="form-control" value="{{ enrolled }}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label">Present Students Today</label>
                    <input type="number" name="present_students" class="form-control" value="{{ present }}" max="{{ enrolled }}" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Recalculate Meal Metrics</button>
            </form>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card p-4">
            <h5 class="fw-bold mb-3">Live Consumption Recalculation</h5>
            <div class="row text-center my-3">
                <div class="col-6 border-end">
                    <small class="text-muted">Attendance Share</small>
                    <h2 class="fw-bold text-primary">{{ attendance_pct }}%</h2>
                </div>
                <div class="col-6">
                    <small class="text-muted">Est. Meal Consumption</small>
                    <h2 class="fw-bold text-success">{{ est_meals }} Meals</h2>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
